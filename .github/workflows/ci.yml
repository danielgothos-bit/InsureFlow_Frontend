# CI del frontend: verifica tipos y compila. Vercel despliega automáticamente cada push a main.
name: CI frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_URL: https://insureflow-gateway-kxhm.onrender.com
      - run: npm audit --omit=dev --audit-level=high
